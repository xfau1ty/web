<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица студентов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="table-wrapper">
        <table class="table">
            <caption class="table__caption">Список студентов группы ИТ-101</caption>
            <thead class="table__head">
                <tr class="table__row">
                    <th class="table__header">№</th>
                    <th class="table__header">Имя</th>
                    <th class="table__header">Фамилия</th>
                    <th class="table__header">Средний балл</th>
                </tr>
            </thead>
            <tbody class="table__body">
                <tr class="table__row">
                    <td class="table__cell">1</td>
                    <td class="table__cell">Иван</td>
                    <td class="table__cell">Петров</td>
                    <td class="table__cell">4.5</td>
                </tr>
                <tr class="table__row">
                    <td class="table__cell">2</td>
                    <td class="table__cell">Мария</td>
                    <td class="table__cell">Сидорова</td>
                    <td class="table__cell">4.8</td>
                </tr>
                <tr class="table__row">
                    <td class="table__cell">3</td>
                    <td class="table__cell">Алексей</td>
                    <td class="table__cell">Козлов</td>
                    <td class="table__cell">4.2</td>
                </tr>
                <tr class="table__row">
                    <td class="table__cell">4</td>
                    <td class="table__cell">Елена</td>
                    <td class="table__cell">Николаева</td>
                    <td class="table__cell">4.9</td>
                </tr>
                <tr class="table__row">
                    <td class="table__cell">5</td>
                    <td class="table__cell">Дмитрий</td>
                    <td class="table__cell">Волков</td>
                    <td class="table__cell">4.0</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
