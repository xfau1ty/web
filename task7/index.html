<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 7: Валидация формы и предотвращение отправки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 class="title">Форма регистрации</h2>
        <form class="form" id="form">
            <div class="form__group">
                <label class="form__label" for="nameInput">Имя:</label>
                <input type="text" class="form__input" id="nameInput" placeholder="Введите ваше имя">
            </div>
            <div class="form__group">
                <label class="form__label" for="emailInput">Email:</label>
                <input type="email" class="form__input" id="emailInput" placeholder="Введите ваш email">
            </div>
            <button type="submit" class="form__button">Отправить</button>
        </form>
        <div class="message" id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
