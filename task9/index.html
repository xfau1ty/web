<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 9: Изменение цвета текста по выбору из выпадающего списка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p class="text" id="text">Измени мой цвет!</p>
        <div class="selector">
            <label class="selector__label" for="colorSelect">Выберите цвет:</label>
            <select class="selector__select" id="colorSelect">
                <option value="">-- Выберите цвет --</option>
                <option value="#FF0000">Красный</option>
                <option value="#00FF00">Зеленый</option>
                <option value="#0000FF">Синий</option>
                <option value="#FF9800">Оранжевый</option>
                <option value="#9C27B0">Фиолетовый</option>
                <option value="#00BCD4">Голубой</option>
            </select>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
