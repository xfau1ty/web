<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form" method="post" action="#">
        <h2 class="form__title">Обратная связь</h2>
        
        <div class="form__group">
            <label class="form__label" for="name">Ваше имя</label>
            <input class="form__input" type="text" id="name" name="name" placeholder="Введите ваше имя" required>
        </div>
        
        <div class="form__group">
            <label class="form__label" for="email">Email</label>
            <input class="form__input" type="email" id="email" name="email" placeholder="Введите ваш email" required>
        </div>
        
        <div class="form__group">
            <label class="form__label" for="message">Сообщение</label>
            <textarea class="form__textarea" id="message" name="message" rows="5" placeholder="Введите ваше сообщение"></textarea>
        </div>
        
        <button class="form__button" type="submit">Отправить</button>
    </form>
</body>
</html>
